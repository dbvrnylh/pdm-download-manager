<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDM – Gestionnaire</title>
    <link rel="icon" href="../icons/icon32.png" />
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="manager.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">
        <img src="../icons/icon32.png" alt="" width="24" height="24" />
        <h1>PDM</h1>
      </div>
      <form id="add-form">
        <input id="add-url" type="url" placeholder="Coller une adresse à télécharger…" required />
        <select id="add-kind" aria-label="Type de téléchargement">
          <option value="file">Fichier</option>
          <option value="video">Vidéo de la page</option>
        </select>
        <button type="submit" class="primary">Ajouter</button>
      </form>
      <button id="open-options" class="link">Réglages</button>
    </header>

    <p id="engine-banner" class="banner" hidden></p>

    <nav class="filters">
      <div id="category-filters" class="chips"></div>
      <div class="filters-end">
        <select id="status-filter" aria-label="Filtrer par état">
          <option value="all">Tous les états</option>
          <option value="active">En cours</option>
          <option value="complete">Terminés</option>
          <option value="failed">Échoués</option>
        </select>
        <button id="clear-complete">Vider les terminés</button>
      </div>
    </nav>

    <p id="error" class="error" role="alert" hidden></p>

    <main>
      <ul id="downloads"></ul>
      <p id="empty" class="empty" hidden>Aucun téléchargement ici.</p>
    </main>

    <footer id="summary"></footer>

    <script type="module" src="manager.js"></script>
  </body>
</html>
