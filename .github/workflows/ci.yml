name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Engine (Python ${{ matrix.python }}${{ matrix.media && ', yt-dlp + ffmpeg' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Version minimale : moteur, démon et pont (les tests yt-dlp s'ignorent sans ffmpeg).
          - python: "3.10"
            media: false
          # Version récente : tout, y compris yt-dlp et ffmpeg.
          - python: "3.13"
            media: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg and yt-dlp
        if: matrix.media
        # APT s'est déjà bloqué sans rien afficher : sortie visible, attentes bornées.
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          sudo -E apt-get $APT_OPTS update
          sudo -E apt-get $APT_OPTS install -y --no-install-recommends ffmpeg
          python -m pip install --quiet yt-dlp
      - name: Run engine, daemon and yt-dlp tests
        run: python -m unittest discover -s tests -v

  extension:
    name: Extension (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint
        run: npx --yes eslint@10.1.0 extension
      - name: Unit tests
        run: node --test tests/lib.test.mjs

  scripts:
    name: Install scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh
