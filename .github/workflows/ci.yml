name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Engine (Python ${{ matrix.python }}${{ matrix.media && ', yt-dlp + ffmpeg' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Version minimale : moteur, démon et pont (les tests yt-dlp s'ignorent sans ffmpeg).
          - python: "3.10"
            media: false
          # Version récente : tout, y compris yt-dlp et ffmpeg.
          - python: "3.13"
            media: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg and yt-dlp
        if: matrix.media
        # ffmpeg en version statique (ffmpeg + ffprobe), téléchargée depuis GitHub : le
        # miroir APT d'Ubuntu, avec sa centaine de dépendances, a bloqué ou coupé 4 des
        # 10 premiers runs. Épinglée sur une publication de fin de mois de
        # BtbN/FFmpeg-Builds, que le projet garde dans la durée (les quotidiennes
        # disparaissent en deux semaines), et vérifiée par son empreinte avant usage.
        timeout-minutes: 5
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: 97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79
        run: |
          curl -fsSL --retry 3 --max-time 240 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=2 \
            --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/ffmpeg" -hide_banner -version
          python -m pip install --quiet yt-dlp
      - name: Run engine, daemon and yt-dlp tests
        run: python -m unittest discover -s tests -v

  extension:
    name: Extension (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint
        run: npx --yes eslint@10.1.0 extension
      - name: Unit tests
        run: node --test tests/lib.test.mjs

  scripts:
    name: Install scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh
