name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Engine (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg and yt-dlp
        # Un miroir APT lent peut sinon bloquer le job pendant des heures.
        timeout-minutes: 8
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $APT_OPTS update -qq
          sudo apt-get $APT_OPTS install -y -qq --no-install-recommends ffmpeg
          python -m pip install --quiet yt-dlp
      - name: Run engine, daemon and yt-dlp tests
        run: python -m unittest discover -s tests -v

  extension:
    name: Extension (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint
        run: npx --yes eslint@10.1.0 extension
      - name: Unit tests
        run: node --test tests/lib.test.mjs

  scripts:
    name: Install scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh
